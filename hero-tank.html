<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DKGL Hero Guide</title><style>
:root{--gold:#ffc349;--text:#f4f8fb;--muted:#a8bac7;--line:rgba(155,203,230,.16)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#173f5c,#07111d 38%,#050b12);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(5,13,22,.95);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(13px)}.topin{max-width:1180px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.back,.langs button{border:1px solid rgba(255,255,255,.15);background:#0b1925;color:white;border-radius:9px;padding:9px 11px;font-weight:900;text-decoration:none;cursor:pointer}.langs{display:flex;gap:5px}.langs button.active{border-color:var(--gold);color:var(--gold)}
main{max-width:1080px;margin:auto;padding:38px 18px 70px}h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1;margin:0 0 10px}p{color:var(--muted);font-size:1.05rem}.shot{margin-top:25px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#071019;box-shadow:0 25px 60px rgba(0,0,0,.3)}.shot img{width:100%;height:auto;border-radius:11px}.bottom{text-align:center;margin-top:30px}
@media(max-width:620px){.topin{align-items:flex-start;flex-direction:column}.langs{overflow:auto;width:100%}}
</style></head>
<body><div class="top"><div class="topin"><a id="back" class="back" href="index.html#heroes"></a><div class="langs"><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="es">ES</button><button data-lang="pt">PT</button><button data-lang="fr">FR</button></div></div></div>
<main><h1 id="title"></h1><p id="intro"></p><div class="shot"><img src="assets/tank-squad-guide.webp" alt=""></div><div class="bottom"><a id="back2" class="back" href="index.html#heroes"></a></div></main>
<script>
const TXT={"en": {"back": "← Back to Heroes & Gorilla", "missile": "Missile Squad Guide", "air": "Air Squad Guide", "tank": "Tank Squad Guide", "intro": "Open the visual guide below to review skill, star and level priorities."}, "de": {"back": "← Zurück zu Helden & Gorilla", "missile": "Guide für den Raketen-Trupp", "air": "Guide für den Luft-Trupp", "tank": "Guide für den Panzer-Trupp", "intro": "Öffne den visuellen Guide unten, um Skill-, Sterne- und Level-Prioritäten zu prüfen."}, "es": {"back": "← Volver a Héroes y Gorila", "missile": "Guía del escuadrón de misiles", "air": "Guía del escuadrón aéreo", "tank": "Guía del escuadrón de tanques", "intro": "Consulta la guía visual para revisar la prioridad de habilidades, estrellas y niveles."}, "pt": {"back": "← Voltar a Heróis e Gorila", "missile": "Guia do esquadrão de mísseis", "air": "Guia do esquadrão aéreo", "tank": "Guia do esquadrão de tanques", "intro": "Consulta o guia visual para rever a prioridade de habilidades, estrelas e níveis."}, "fr": {"back": "← Retour à Héros et Gorille", "missile": "Guide de l’escouade de missiles", "air": "Guide de l’escouade aérienne", "tank": "Guide de l’escouade de chars", "intro": "Consulte le guide visuel pour revoir les priorités de compétences, d’étoiles et de niveaux."}}; const qp=new URLSearchParams(location.search); let lang=qp.get("lang")||localStorage.getItem("dkgl-lang")||"en"; if(!TXT[lang])lang="en";
function paint(){document.documentElement.lang=lang;localStorage.setItem("dkgl-lang",lang);document.getElementById("title").textContent=TXT[lang]["tank"];document.getElementById("intro").textContent=TXT[lang].intro;document.getElementById("back").textContent=TXT[lang].back;document.getElementById("back2").textContent=TXT[lang].back;document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;history.replaceState(null,"","?lang="+lang);paint();});paint();
</script></body></html>
